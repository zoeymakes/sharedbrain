# agents/registry.sample-multi-runtime.yaml
#
# 런타임이 여러 개일 때 registry 가 어떤 모습이 되는지 보여 주는 **가상의 예시**다.
# 실제 인벤토리를 그대로 커밋하지 않는다. 자기 registry.yaml 은 .gitignore 대상이다.
#
# 이 예시가 보여 주려는 것
#   1. 같은 런타임(hermes)이라도 프로필이 다르면 로우가 둘이고 권한도 다르다
#   2. 이름 하나는 런타임 하나에만 쓴다 (claude-code 와 codex 는 다른 이름)
#   3. Orca 같은 병렬 실행 환경은 agents 가 아니라 environments 에 둔다
#   4. 은퇴한 에이전트는 지우지 않고 retired 로 남겨 기록의 출처를 보존한다
#   5. role 은 "무엇을 담당하는가"까지만 쓴다. 서비스명·계정·거래 권한 같은
#      민감한 세부는 registry 가 아니라 각 기기의 로컬 설정에 둔다

version: 0.1
owner: <내 핸들>

agents:
  - name: 비서에이전트
    runtime: hermes
    profile: default
    devices: [always-on-host]
    interfaces: [chat]
    role: 상시 자동화·일정 정리·지식 승격
    wiki_access: read-write          # 공유 지식 정본을 고칠 수 있는 단일 주체
    status: active

  - name: 기록에이전트
    runtime: hermes
    profile: secondary
    devices: [always-on-host]
    interfaces: [chat]
    role: 특정 영역의 정기 리포트 생성
    wiki_access: 자기 영역만          # 정본 승격 금지
    status: active
    note: 같은 런타임이지만 프로필이 달라 별도 에이전트다.

  - name: 코드작업자
    runtime: claude
    devices: [always-on-host, laptop]
    environments: [terminal, orca]
    role: 개발·문서 작업
    wiki_access: read-write
    status: active

  - name: 검증작업자
    runtime: codex
    devices: [always-on-host, laptop]
    environments: [terminal, orca]
    role: 구현·독립 검증
    wiki_access: read-write
    status: active
    note: 코드작업자와 이름을 나눈 이유는 기록을 구분하기 위해서다.

  - name: 브라우저작업자
    runtime: aside
    devices: [laptop, second-mac]
    role: 브라우저 현장 작업
    wiki_access: 자기 영역만
    status: active
    note: 브라우저 탭·로그인·쿠키는 공유하지 않고 기기 로컬에 둔다.

  - name: 글작성자
    runtime: openclaw
    profile: writer
    devices: [always-on-host]
    role: 블로그 초안 작성
    wiki_access: 자기 영역만
    status: active

  # ---- retired: 지우지 않고 남겨 과거 기록의 출처를 보존한다 ----
  - {name: 실험에이전트, runtime: openclaw, profile: experiment, status: retired}
  - {name: 기록에이전트(구), runtime: openclaw, profile: legacy, status: retired, note: hermes 프로필로 이사}

environments:
  - name: orca
    kind: ADE
    devices: [always-on-host, laptop]
    role: CLI 에이전트 병렬 실행·worktree 격리. 에이전트가 아니다.
    rule: 이 환경에서 작업하면 기록의 Update 줄에 `orca:<worktree>` 를 함께 적는다.
  - name: terminal
    kind: 터미널
    role: 직접 실행 (tmux 포함)
  - name: browser
    kind: 브라우저
    role: 브라우저 내 실행 환경

daemons:
  - dashboard-service
  - scheduled-reports
  - message-bridge

excluded:
  - {name: <쓰지 않게 된 IDE>, reason: 더 이상 사용하지 않음}
  - {name: 데스크톱 챗 앱, reason: 에이전트가 아니라 도구}
