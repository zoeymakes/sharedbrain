# agents/registry.example.yaml — 내 에이전트군 선언 양식
#
# 이 파일을 agents/registry.yaml 로 복사해서 내 환경에 맞게 채운다.
# registry.yaml 은 개인 정보가 들어가므로 .gitignore 대상이다.
#
#   cp agents/registry.example.yaml agents/registry.yaml
#   node agents/registry.mjs validate    # 스키마 검증
#   node agents/registry.mjs list        # 요약 보기
#   node agents/registry.mjs next        # 아직 위키에 안 붙인 에이전트와 실행할 단계
#
# 3개 층을 구분해서 적는다.
#   agents        : 정체성을 가진 실행 주체 (이름·역할 기준. 소프트웨어 기준이 아니다)
#   environments  : 에이전트를 실행하는 환경 (IDE/ADE/터미널). 에이전트가 아니다.
#   daemons       : 상시 자동화 프로세스. 에이전트가 아니지만 시스템 지도에 필요하다.
#
# 규칙
#   - 로우 1개 = 에이전트 정체성 1개. 같은 런타임이라도 프로필이 다르면 로우도 다르다.
#     (예: 비서 프로필 / 투자 프로필 → 로우 2개)
#   - 같은 이름이 여러 기기에서 돌아도 에이전트는 하나. 위키 콜렉션도 하나.
#     → 그래서 이름 하나는 런타임 하나에만 쓴다. Claude Code와 Codex를 함께 쓰면 이름을 나눈다.
#   - runtime 값은 claude | codex | hermes | aside | openclaw 중 하나.
#     (state.mjs 의 kind 와 같은 어휘를 쓴다. 다르면 agent-add 가 실패한다)
#   - 비밀값 금지. 경로·변수명·설정 포인터까지만 적는다.

version: 0.1
owner: <내 이름 또는 핸들>

agents:
  - name: <에이전트 이름>          # 위키 콜렉션·서명에 쓰인다
    runtime: <런타임>              # claude | codex | hermes | aside | openclaw
    profile: <프로필>              # 런타임이 프로필을 지원할 때만 (Hermes, OpenClaw 등)
    devices: [<기기1>, <기기2>]     # 짧은 호스트 이름 또는 별칭
    interfaces: [<인터페이스>]      # 예: slack, telegram, discord, cli
    environments: [<환경>]          # environments 섹션의 name 참조
    role: <이 에이전트가 맡는 일>
    wiki_access: <권한>            # read-write | read-only | 자기 영역만
    status: active                 # active | retired | migrating
    note: <특이사항>

environments:
  - name: <환경 이름>              # 예: orca, terminal, browser
    kind: <종류>                   # 예: ADE, 터미널, 브라우저
    devices: [<기기>]
    role: <역할>
    rule: <이 환경에서 추가로 지킬 기록 규칙>

daemons:
  - <상시 자동화 이름>

excluded:
  - {name: <제외한 도구>, reason: <제외 이유>}
